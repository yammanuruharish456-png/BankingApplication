name: Deploy to EC2

on:
  push:
    branches: [ main ]

jobs:
  deploy:
    runs-on: ubuntu-latest
    needs: []

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Java 17
        uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'temurin'
          cache: maven

      - name: Build JAR
        run: mvn clean package -DskipTests --no-transfer-progress

      - name: Set up SSH key
        run: |
          mkdir -p ~/.ssh
          echo "${{ secrets.EC2_SSH_KEY }}" > ~/.ssh/ec2_key.pem
          chmod 600 ~/.ssh/ec2_key.pem
          ssh-keyscan -H ${{ secrets.EC2_HOST }} >> ~/.ssh/known_hosts

      - name: Copy JAR to EC2
        run: |
          scp -i ~/.ssh/ec2_key.pem target/banking-app.jar \
            ${{ secrets.EC2_USER }}@${{ secrets.EC2_HOST }}:~/banking-app/banking-app.jar

      - name: Copy docker-compose to EC2
        run: |
          scp -i ~/.ssh/ec2_key.pem docker-compose.yml \
            ${{ secrets.EC2_USER }}@${{ secrets.EC2_HOST }}:~/banking-app/docker-compose.yml

      - name: Copy Dockerfile to EC2
        run: |
          scp -i ~/.ssh/ec2_key.pem Dockerfile \
            ${{ secrets.EC2_USER }}@${{ secrets.EC2_HOST }}:~/banking-app/Dockerfile

      - name: Deploy with docker-compose
        run: |
          ssh -i ~/.ssh/ec2_key.pem ${{ secrets.EC2_USER }}@${{ secrets.EC2_HOST }} '
            cd ~/banking-app
            mkdir -p target
            cp banking-app.jar target/banking-app.jar
            docker compose down || true
            docker compose up -d --build
          '
